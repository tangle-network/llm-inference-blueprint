name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
permissions:
  contents: write
env:
  TARGET: x86_64-unknown-linux-gnu
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build operators
        run: |
          docker build --platform linux/amd64 --target builder -f operator/Dockerfile -t operator-release .
          mkdir -p target/release
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/target/release:/export" operator-release sh -c 'cp /out/* /export/'
      - name: Package operators
        run: |
          for binary in llm-operator operator-lite; do
            strip "target/release/$binary"
            archive="$binary-$TARGET.tar.xz"
            tar -cJf "$archive" -C target/release "$binary"
            sha256sum "$archive" > "$archive.sha256"
            (cd target/release && sha256sum "$binary") > "$binary.sha256"
            cut -d' ' -f1 "$binary.sha256" > "$binary-$TARGET.bin.sha256"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          gh release upload "$TAG" ./*.tar.xz ./*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
