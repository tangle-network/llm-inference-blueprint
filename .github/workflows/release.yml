name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config clang cmake
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-dist
        run: |
          DIST_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("dist-workspace.toml", "rb"))["dist"]["cargo-dist-version"])')
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "https://github.com/astral-sh/cargo-dist/releases/download/v$DIST_VERSION/cargo-dist-installer.sh" | sh
      - name: Build native release artifacts
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true dist build --tag "$TAG" --artifacts=all --output-format=json > "$RUNNER_TEMP/dist-manifest.json"
          git diff --exit-code -- Cargo.lock
      - name: Qualify operator-lite serving image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CORE_REVISION=$(python3 -c 'import tomllib; print(tomllib.load(open("operator/Cargo.toml", "rb"))["dependencies"]["tangle-inference-core"]["rev"])')
          [[ "$CORE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/tangle-network/tangle-inference-core/$CORE_REVISION/engine-profiles.json" -o "$RUNNER_TEMP/engine-profiles.json"
          ENGINE_IMAGE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$RUNNER_TEMP/engine-profiles.json")
          [[ "$ENGINE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          export CORE_REVISION ENGINE_IMAGE
          COMMIT=$(git rev-parse HEAD)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/operator-lite"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern operator-lite-image.txt --dir "$RUNNER_TEMP/prior-image"; then
            PRIOR_IMAGE=$(cat "$RUNNER_TEMP/prior-image/operator-lite-image.txt")
            [[ "$PRIOR_IMAGE" == "$IMAGE@sha256:"* && "${PRIOR_IMAGE#"$IMAGE@sha256:"}" =~ ^[a-f0-9]{64}$ ]]
            docker pull "$PRIOR_IMAGE"
            docker tag "$PRIOR_IMAGE" qualified-operator-lite
            cp "$RUNNER_TEMP/prior-image/operator-lite-image.txt" "$RUNNER_TEMP/operator-lite-image.txt"
          else
            docker build --platform linux/amd64 --target operator-lite -f operator/Dockerfile --build-arg ENGINE_IMAGE="$ENGINE_IMAGE" --build-arg VCS_REF="$COMMIT" --build-arg CORE_REVISION="$CORE_REVISION" -t qualified-operator-lite .
          fi
          docker image inspect qualified-operator-lite > "$RUNNER_TEMP/operator-lite-image.json"
          python3 - <<'VERIFY'
          import json, os, subprocess
          image = json.load(open(os.environ["RUNNER_TEMP"] + "/operator-lite-image.json"))[0]["Config"]
          assert image["Entrypoint"] == ["/usr/local/bin/operator-lite"]
          assert image["Cmd"] in (None, []) and image["User"] == "operator"
          labels = image["Labels"]
          assert labels["org.opencontainers.image.revision"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert labels["org.opencontainers.image.base.name"] == os.environ["ENGINE_IMAGE"]
          assert labels["tools.tangle.inference-core.revision"] == os.environ["CORE_REVISION"]
          VERIFY
          docker run --rm --entrypoint sh qualified-operator-lite -ec 'test "$(id -u)" != 0; ldd /usr/local/bin/operator-lite | tee /tmp/ldd; ! grep -q "not found" /tmp/ldd; python3 -c "import sglang.launch_server"'
      - name: Publish GitHub Release and serving image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft
          UPLOAD_FILES=$(jq -er '.upload_files[]' "$RUNNER_TEMP/dist-manifest.json")
          mapfile -t FILES <<< "$UPLOAD_FILES"
          FILES+=("$RUNNER_TEMP/dist-manifest.json" "$RUNNER_TEMP/operator-lite-image.txt")
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in "${FILES[@]}"; do
            name=$(basename "$file")
            if grep -qxF "$name" <<< "$ASSETS"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/prior-release"
              cmp "$RUNNER_TEMP/prior-release/$name" "$file"
            fi
          done
          if ! test -s "$RUNNER_TEMP/operator-lite-image.txt"; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/operator-lite"
            COMMIT=$(git rev-parse HEAD)
            docker tag qualified-operator-lite "$IMAGE:sha-$COMMIT"
            docker tag qualified-operator-lite "$IMAGE:$TAG"
            docker push "$IMAGE:sha-$COMMIT"
            docker push "$IMAGE:$TAG"
            docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$COMMIT" > "$RUNNER_TEMP/operator-lite-image.txt"
            grep -Eq '^ghcr.io/.+@sha256:[a-f0-9]{64}$' "$RUNNER_TEMP/operator-lite-image.txt"
          fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
