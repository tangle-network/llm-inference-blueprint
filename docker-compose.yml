services:
  operator:
    build:
      context: .
      dockerfile: operator/Dockerfile
    command: ["run", "--keystore-uri", "/home/operator/state/keystore"]
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/config.example.json:/home/operator/config.json:ro
      - huggingface-cache:/home/operator/.cache/huggingface
      - operator-state:/home/operator/state
    environment:
      - VLLM_OP_CONFIG=/home/operator/config.json
      - VLLM_OP_TANGLE__OPERATOR_KEY=${OPERATOR_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - DATA_DIR=/home/operator/state
      - HTTP_RPC_URL=${RPC_URL:?Set RPC_URL}
      - WS_RPC_URL=${WS_RPC_URL:?Set WS_RPC_URL}
      - BLUEPRINT_ID=${BLUEPRINT_ID:?Set BLUEPRINT_ID}
      - SERVICE_ID=${SERVICE_ID:?Set SERVICE_ID}
      - TANGLE_CONTRACT=${TANGLE_CONTRACT:?Set TANGLE_CONTRACT}
      - STAKING_CONTRACT=${STAKING_CONTRACT:?Set STAKING_CONTRACT}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Local Anvil chain for development
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"

volumes:
  huggingface-cache:
  operator-state:
