[package]
name = "llm-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "llm_inference"
path = "src/lib.rs"

[[bin]]
name = "llm-operator"
path = "src/main.rs"

# Minimal HTTP-only operator for E2E tests — skips BlueprintRunner and
# Tangle Substrate, runs just the HTTP server + billing client.
[[bin]]
name = "operator-lite"
path = "src/bin/operator_lite.rs"

[dependencies]
blueprint-sdk = { workspace = true, features = ["tee"] }
alloy = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }

# Shared inference operator infrastructure (billing, metrics, health, server helpers).
# Pinned to the #2 merge commit on master (PaymentRails + PaymentRouter + Direct
# rail + rail-agnostic orchestration: resolve_payment_proof/authorize_request/
# settle_request). Pinned by SHA for reproducible CI; bump as core advances.
tangle-inference-core = { git = "https://github.com/tangle-network/tangle-inference-core", rev = "c7e11063a2ba30c662c64356a73bd81d4a03a267", default-features = false, features = ["billing", "http", "metrics"] }

# Web framework (for OpenAI-compatible HTTP server)
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Streaming
futures-util = { workspace = true }
tokio-stream = { workspace = true }

# Misc
bytes = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
blueprint-anvil-testing-utils = { git = "https://github.com/tangle-network/blueprint", rev = "be8bd303260d3b1e1df6624eeac92b3ce1f40c38", package = "blueprint-anvil-testing-utils" }
wiremock = "0.6"
alloy-primitives = "1"
alloy-sol-types = "1"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
