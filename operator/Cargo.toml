[package]
name = "llm-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["chain"]
chain = ["dep:blueprint-sdk"]
chain-tests = ["chain", "dep:blueprint-anvil-testing-utils"]

[lib]
name = "llm_inference"
path = "src/lib.rs"

[[bin]]
name = "llm-operator"
path = "src/main.rs"
required-features = ["chain"]

# HTTP operator; the chain runner is optional.
[[bin]]
name = "operator-lite"
path = "src/bin/operator_lite.rs"

[dependencies]
blueprint-sdk = { workspace = true, features = ["tee"], optional = true }
blueprint-anvil-testing-utils = { git = "https://github.com/tangle-network/blueprint", rev = "1159090e224e9c3c7a83f896300472d3196a5073", package = "blueprint-anvil-testing-utils", optional = true }
alloy = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
regex = "1"
unicode-normalization = "0.1"

# Shared inference operator infrastructure (billing, metrics, health, server helpers).
tangle-inference-core = { git = "https://github.com/tangle-network/tangle-inference-core", rev = "a536bc5bc97aa3642e47c91937411b1b0c6556ac", default-features = false, features = ["billing", "http", "metrics"] }

# Web framework (for OpenAI-compatible HTTP server)
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Streaming
futures-util = { workspace = true }
tokio-stream = { workspace = true }

# Misc
bytes = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
blueprint-keystore = { version = "=0.2.0-alpha.15", default-features = false, features = ["std", "ecdsa"] }
wiremock = "0.6"
alloy-primitives = "1"
alloy-sol-types = "1"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

tempfile = "3"

[[test]]
name = "harness_e2e"
required-features = ["chain-tests"]
